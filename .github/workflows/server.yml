# ClubShell central server (server/, docs/server/DESIGN.md).
#
#   changes  ubuntu  does this push/PR touch the server or what it builds from? (dorny/paths-filter)
#   server   ubuntu  restore/build (-warnaserror)/test of server/ClubShell.Server.sln against a postgres:18 service,
#                    then contract drift: server/contracts vs deepunites/club-contracts at server/contracts/REF
#   e2e-admin-real  ubuntu  the admin console's Playwright suite (tests/shell-e2e, project admin) against this server
#                    (ADMIN_SERVER=real, DESIGN §10.c) on a throwaway postgres:18 database
#   docker-smoke  ubuntu  server/Dockerfile + server/compose.yaml: build the image, `docker compose up --wait`, then
#                    server/scripts/smoke.sh (/health, register a PC, signed heartbeat) against the container (DESIGN §11 S6)
#
# Separate from ci.yml: the server needs PostgreSQL and runs on Linux like production; the agent jobs stay on Windows.

name: Server

# No workflow-level `paths:` filter: the server check is required on main, and a workflow skipped by `paths:` leaves a
# required check pending forever. The `changes` job decides instead; a job skipped by `if:` reports success.
on:
  push:
    branches:
      - main
      - 'release/**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  changes:
    name: Detect server changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      server: ${{ steps.filter.outputs.server }}
    steps:
      - uses: actions/checkout@v4

      - name: Classify changed files
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            server:
              - 'server/**'
              - 'src/ClubShell.Contracts/**'
              - 'src/ClubShell.Core/**'
              - 'config/policies.example.json'
              - 'Directory.*.props'
              - 'global.json'
              - 'nuget.config'
              - '.editorconfig'
              - '.github/workflows/server.yml'

  server:
    name: Server (build, test on PostgreSQL 18)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway CI container, reachable only from this job.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CLUBSHELL_TEST_PG: Host=localhost;Port=5432;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore server/ClubShell.Server.sln

      - name: Build
        run: dotnet build server/ClubShell.Server.sln -c Release --no-restore /warnaserror

      - name: Test
        run: dotnet test server/ClubShell.Server.sln -c Release --no-build --logger trx --results-directory artifacts/server-test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-test-results
          path: artifacts/server-test-results
          if-no-files-found: warn
          retention-days: 14

      # openapi.json/asyncapi.json must be the yaml converted (the schema tests read the json, the 501 table the yaml), and both
      # yaml files must equal club-contracts at REF. REF may be a club-contracts commit that is not pushed yet (52a895a,
      # branch shell-changes-p0-p1): then the remote comparison is skipped with a warning, so main does not go red over
      # another repository. Once REF is fetchable the comparison is strict.
      - name: Contract drift (server/contracts vs club-contracts@REF)
        shell: bash
        env:
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          python3 -c 'import yaml' 2>/dev/null || python3 -m pip install --quiet --user --break-system-packages pyyaml
          python3 - <<'PY'
          import json, sys, yaml
          failed = False
          for name in ('openapi', 'asyncapi'):
              with open(f'server/contracts/{name}.yaml', encoding='utf-8') as f:
                  expected = yaml.safe_load(f)
              with open(f'server/contracts/{name}.json', encoding='utf-8') as f:
                  actual = json.load(f)
              if expected != actual:
                  print(f'::error file=server/contracts/{name}.json::not generated from {name}.yaml; run server/scripts/sync-contracts.ps1')
                  failed = True
          sys.exit(1 if failed else 0)
          PY

          ref=$(tr -d '[:space:]' < server/contracts/REF)
          checkout="$RUNNER_TEMP/club-contracts"
          git init -q "$checkout"
          if ! git -C "$checkout" fetch -q --depth 1 https://github.com/deepunites/club-contracts.git "$ref"; then
            echo "::warning file=server/contracts/REF::club-contracts@$ref cannot be fetched (not pushed yet or not accessible); drift check skipped"
            exit 0
          fi

          failed=0
          for pair in openapi/openapi.yaml:openapi.yaml asyncapi/asyncapi.yaml:asyncapi.yaml; do
            if ! git -C "$checkout" show "FETCH_HEAD:${pair%%:*}" | cmp -s - "server/contracts/${pair##*:}"; then
              echo "::error file=server/contracts/${pair##*:}::differs from club-contracts@$ref:${pair%%:*}; run server/scripts/sync-contracts.ps1"
              failed=1
            fi
          done
          exit $failed

  e2e-admin-real:
    name: Admin console e2e against the real server
    needs: [changes, server]
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          # Throwaway CI container: the database the server migrates and seeds (Seed:Dev) for this run only.
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: clubshell_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ADMIN_SERVER: real
      ADMIN_SERVER_DB: Host=localhost;Port=5432;Database=clubshell_e2e;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET SDK (global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build TypeScript contracts
        run: pnpm contracts:build

      - name: Install Playwright Chromium
        run: pnpm --filter @clubshell/shell-e2e exec playwright install --with-deps chromium

      # Built ahead so the webServer's `dotnet run` starts within its timeout.
      - name: Build the server
        run: dotnet build server/src/ClubShell.Server

      - name: Run the admin e2e against the real server
        run: pnpm --filter @clubshell/shell-e2e exec playwright test --project admin

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-admin-real
          path: |
            tests/shell-e2e/playwright-report
            tests/shell-e2e/test-results
          if-no-files-found: ignore
          retention-days: 14

  docker-smoke:
    name: Docker image and compose smoke
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Throwaway values for this run only; the auto-approve flag is for tests (a real deployment approves PCs by hand).
      POSTGRES_PASSWORD: smokepassword
      CLUB_ENROLLMENT_KEY: smoke-club-key
      CLUB_AUTO_APPROVE_PCS: 'true'
      CORS_ORIGIN: http://localhost:1431
    steps:
      - uses: actions/checkout@v4

      - name: Build the image and start the stack
        run: docker compose -f server/compose.yaml up -d --build --wait --wait-timeout 90

      - name: Smoke (health, register, signed heartbeat)
        env:
          CLUB_KEY: smoke-club-key
        run: bash server/scripts/smoke.sh http://localhost:8080

      - name: Container logs
        if: failure()
        run: docker compose -f server/compose.yaml logs --no-color --tail 200

      - name: Tear down
        if: always()
        run: docker compose -f server/compose.yaml down -v
