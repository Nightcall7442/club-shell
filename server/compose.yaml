# ClubShell central server + PostgreSQL 18 (docs/server/DESIGN.md §11 S6).
#
#   cp server/.env.example server/.env     # fill in the secrets
#   docker compose -f server/compose.yaml up -d --build
#
# Single server instance per database (DESIGN D-20: the WebSocket hub keeps its state in memory). Put a TLS reverse proxy
# in front of port 8080 for production; see server/README.md.

name: clubshell

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: clubshell
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}
      POSTGRES_DB: clubshell
    volumes:
      # PostgreSQL 18 images keep the cluster in a versioned subdirectory: mount the parent, not .../data.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clubshell -d clubshell"]
      interval: 5s
      timeout: 5s
      retries: 12

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # A password containing ';' or '=' must be quoted in the connection string; keep it alphanumeric.
      ConnectionStrings__Club: Host=db;Port=5432;Database=clubshell;Username=clubshell;Password=${POSTGRES_PASSWORD}
      Club__Name: ${CLUB_NAME:-ClubShell}
      Club__TimeZone: ${CLUB_TIMEZONE:-Asia/Tashkent}
      Club__EnrollmentKey: ${CLUB_ENROLLMENT_KEY:?set CLUB_ENROLLMENT_KEY in server/.env}
      Club__OwnerPin: ${CLUB_OWNER_PIN:-}
      Club__AutoApprovePcs: ${CLUB_AUTO_APPROVE_PCS:-false}
      Cors__AllowedOrigins__0: ${CORS_ORIGIN:?set CORS_ORIGIN (origin of the admin console) in server/.env}
      # Only behind a proxy that overwrites this header; leave empty when the server is exposed directly.
      Proxy__ClientIpHeader: ${PROXY_CLIENT_IP_HEADER:-}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      # JWT signing key, PIN pepper, seed JSON. Back it up together with the database (server/README.md).
      - data:/app/data
    healthcheck:
      # The aspnet image has no curl and its sh (dash) has no /dev/tcp: open the port with bash and read the status line of GET /health.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8080 &&
          printf 'GET /health HTTP/1.0\r\nHost: localhost\r\n\r\n' >&3 &&
          head -n 1 <&3 | grep -q ' 200 '
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  pgdata:
  data:
